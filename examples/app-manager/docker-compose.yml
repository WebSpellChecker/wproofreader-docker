# WProofreader Server + App-manager on a single host.
#
#   cp .env.example .env   # fill in the values
#   docker compose up -d
#
# Guide: README.md

name: wproofreader

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # db-manager connects from another container to provision the service DB.
      # MySQL is not published to the host, so this account stays on the private
      # Compose network.
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: app_manager_db
      MYSQL_USER: app_manager
      MYSQL_PASSWORD: ${APP_MANAGER_DB_PASSWORD:?set APP_MANAGER_DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP on purpose: the init-phase server listens on the socket only
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # One-shot: creates cloud_service, applies the schema and seed data, creates the DB users.
  # Safe to re-run; already applied changesets are skipped.
  db-manager:
    image: ${DB_MANAGER_IMAGE:-webspellchecker/db-manager}:${DB_MANAGER_VERSION:-${WPROOFREADER_VERSION:-latest}}
    restart: "no"
    command: ["migrate"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: cloud_service
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_CONTEXTS: external,seed
      MIGRATION_MODE: bootstrap
      PROVISION_PREDEFINED_USERS: "true"
      APPSERVER_USERNAME: appserver
      APPSERVER_PASSWORD: ${APPSERVER_DB_PASSWORD:?set APPSERVER_DB_PASSWORD in .env}
      APP_MANAGER_USERNAME: app_service
      APP_MANAGER_PASSWORD: ${SERVICE_DB_PASSWORD:?set SERVICE_DB_PASSWORD in .env}
      LOG_LEVEL: ${DB_MANAGER_LOG_LEVEL:-INFO}
      DB_MAX_RETRIES: "30"
      DB_RETRY_INTERVAL: "2"
    depends_on:
      mysql:
        condition: service_healthy

  appserver:
    image: ${WPROOFREADER_IMAGE:-webspellchecker/wproofreader}:${WPROOFREADER_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APPSERVER_PORT:-8081}:8080"
    environment:
      WPR_LICENSE_TICKET_ID: ${LICENSE_TICKET_ID:?set LICENSE_TICKET_ID in .env}
      WPR_ENABLE_DATABASE_PROVIDER: "true"
      WPR_DATABASE_HOST: mysql
      WPR_DATABASE_PORT: "3306"
      WPR_DATABASE_SCHEMA: cloud_service
      WPR_DATABASE_USER: appserver
      WPR_DATABASE_PASSWORD: ${APPSERVER_DB_PASSWORD}
      WPR_ENABLE_REQUEST_STATISTIC: "true"
      WPR_ENABLE_USER_ACTION_STATISTIC: "true"
      WPR_ENABLE_REQUEST_VALIDATION: "true"
    volumes:
      - appserver-dictionaries:/dictionaries
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /wscservice/api?cmd=status HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      db-manager:
        condition: service_completed_successfully

  app-manager:
    image: ${APP_MANAGER_IMAGE:-webspellchecker/app-manager}:${APP_MANAGER_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_MANAGER_PORT:-8080}:8080"
    environment:
      APP_EDITION: onprem
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      APP_URL: ${APP_MANAGER_URL:-http://localhost:${APP_MANAGER_PORT:-8080}}
      APP_SERVER_URL: ${APPSERVER_URL:-http://localhost:${APPSERVER_PORT:-8081}/wscservice/api}
      APP_SERVER_INTERNAL_URL: http://appserver:8080/wscservice/api
      LOG_OUTPUT_LEVEL: ${APP_MANAGER_LOG_LEVEL:-info}
      SSL_MODE: "off"
      PROXY_TYPE: ${PROXY_TYPE:-generic}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: app_manager_db
      DB_USERNAME: app_manager
      DB_PASSWORD: ${APP_MANAGER_DB_PASSWORD}
      SERVICE_DB_HOST: mysql
      SERVICE_DB_PORT: "3306"
      SERVICE_DB_DATABASE: cloud_service
      SERVICE_DB_USERNAME: app_service
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      PROFILE_PHOTO_DISK: public
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-app-manager@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-App-manager}
      LARAVEL_ENVIRONMENT_VALIDATION: "true"
      LARAVEL_PROVISION_APP_MANAGER_DB: "true"
      LARAVEL_SEED_APP_MANAGER_DB: "false"
      LARAVEL_MIGRATION_WAIT_DB_TIMEOUT: "120"
    volumes:
      - app-manager-storage:/var/www/html/storage/app
    healthcheck:
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      db-manager:
        condition: service_completed_successfully

volumes:
  mysql-data:
  appserver-dictionaries:
  app-manager-storage:
